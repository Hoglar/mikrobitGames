name: microbit firmware
on:
  push:
    paths: ['microbit/**', 'spec/contracts/microbit-webapp/**', '.github/workflows/microbit-firmware.yml']
  pull_request:
    paths: ['microbit/**', 'spec/contracts/microbit-webapp/**', '.github/workflows/microbit-firmware.yml']
permissions:
  contents: read
jobs:
  host-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S microbit -B microbit/build/host -DCMAKE_BUILD_TYPE=Debug -DMIKROBIT_SANITIZERS=ON
      - run: cmake --build microbit/build/host --parallel 2
      - run: ctest --test-dir microbit/build/host --output-on-failure
  v2-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib ninja-build
      - run: python3 microbit/toolchain/build.py
      - run: python3 -m pip install pyelftools==0.33
      - run: python3 microbit/verification/audit_layout.py microbit/build/v2/MICROBIT
      - uses: actions/upload-artifact@v4
        with:
          name: microbit-v2-firmware
          path: microbit/build/v2/
